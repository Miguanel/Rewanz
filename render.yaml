# REWANŻ – Render Blueprint (architektura rozproszona, 3 niezależne usługi)
#
#   rewanz-web  (static site, CDN)  ── nigdy nie śpi, PWA działa offline
#        │  HTTPS + CORS
#        ▼
#   rewanz-api  (web service, FastAPI) ── darmowy plan usypia po 15 min
#        │  sieć prywatna Render
#        ▼
#   rewanz-db   (PostgreSQL)
#
# Wdrożenie: Render Dashboard → New → Blueprint → wskaż repozytorium.
# Szczegóły: docs/WDROZENIE.md

services:
  # ---------------------------------------------------------------- API
  - type: web
    name: rewanz-api
    runtime: python
    plan: free                 # produkcja: starter (bez usypiania) – patrz docs/WDROZENIE.md
    region: frankfurt          # najbliżej Polski
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    # Darmowy plan nie ma preDeployCommand → migracje w skrypcie startowym.
    # Na planie płatnym: preDeployCommand: alembic upgrade head
    startCommand: bash scripts/start.sh
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: rewanz-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Adres frontendu. Regex łapie też sufiks dodany przez Render, gdy nazwa
      # jest zajęta, oraz podglądy PR (rewanz-web-pr-12.onrender.com).
      - key: CORS_ORIGIN_REGEX
        value: ^https://rewanz-web(-[a-z0-9-]+)?\.onrender\.com$
      # Własna domena (opcjonalnie, po przecinku): https://rewanz.pl,https://www.rewanz.pl
      - key: CORS_ORIGINS
        value: http://localhost:5173
      - key: SEED_DEMO
        value: "true"          # dane demo przy pierwszym starcie; potem ustaw "false"
      - key: DB_POOL_SIZE
        value: "3"             # darmowa baza ma limit połączeń
      - key: DB_MAX_OVERFLOW
        value: "2"

  # ---------------------------------------------------------- FRONTEND
  - type: web
    name: rewanz-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install --no-audit --no-fund && npm run build
    staticPublishPath: dist
    autoDeployTrigger: commit
    envVars:
      # Adres API widoczny w panelu rewanz-api (Settings → URL).
      # Jeśli Render nadał inny adres (np. z sufiksem) – popraw i zrób redeploy frontendu.
      - key: VITE_API_URL
        value: https://rewanz-api.onrender.com
      - key: NODE_VERSION
        value: "20"
    routes:
      # SPA: każda ścieżka bez pliku → index.html (router po stronie przeglądarki)
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Pliki z hashem w nazwie – cache na rok (telefony nie pobierają ich ponownie)
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # Service worker i HTML zawsze świeże – inaczej aktualizacje nie docierają
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY

databases:
  - name: rewanz-db
    plan: free                 # UWAGA: darmowa baza wygasa po 30 dniach – patrz docs/WDROZENIE.md
    region: frankfurt          # ten sam region co API
    databaseName: rewanz
    user: rewanz
    postgresMajorVersion: "16"
